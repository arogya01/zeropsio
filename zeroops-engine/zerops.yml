# zerops.yml - Production Deployment for ZeroOps Engine
zerops:
  - setup: studio
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build:web
        - npm ci --omit=dev
      deployFiles:
        - src
        - public
        - web/dist
        - package.json
        - package-lock.json
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node src/server/index.js
      envVariables:
        PORT: 3000
        NODE_ENV: production
