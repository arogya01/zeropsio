<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · ZeroOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/design/system.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--surface-base, var(--bg));
      color: var(--text-primary, var(--text));
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 var(--gutter, 28px);
      border-bottom: 1px solid var(--border-subtle, var(--line-2));
      background: color-mix(in srgb, var(--surface-white, var(--surface)) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .bar a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary, var(--text));
      font-weight: 600;
      font-size: 16px;
      line-height: 24px;
    }

    .bar .back {
      font-weight: 500;
      color: var(--text-medium, var(--text-2));
      font-size: 16px;
      line-height: 24px;
    }

    .bar .back:hover {
      color: var(--text-primary, var(--text));
    }

    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px var(--gutter, 28px);
    }

    .card {
      width: min(400px, 100%);
      border: 1px solid var(--border-subtle, var(--line));
      background: var(--surface-white, var(--surface));
      border-radius: var(--r-card, var(--r));
      padding: 28px 24px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -0.25px;
      color: var(--text-primary, var(--text));
    }

    .sub {
      margin: 0 0 24px;
      color: var(--text-medium, var(--text-2));
      font-size: 16px;
      line-height: 24px;
    }

    .sub code {
      font-family: var(--mono);
      font-size: 0.9em;
    }

    .field {
      margin-bottom: 14px;
    }

    .error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--fail) 35%, var(--border-subtle, var(--line)));
      background: color-mix(in srgb, var(--fail) 8%, var(--surface-white, var(--surface)));
      color: var(--fail);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      border-radius: var(--r-card, var(--r));
    }

    .error.is-on {
      display: block;
    }

    .toggle {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--text-muted, var(--text-3));
    }

    .toggle a {
      color: var(--brand-blue, var(--mark));
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }

    .toggle a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle, var(--line-2));
      font-family: var(--font);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      letter-spacing: 0.125px;
      color: var(--text-muted, var(--text-3));
    }
  </style>
</head>
<body>
  <header class="bar">
    <a href="/"><span class="zo-mark">Z</span> ZeroOps</a>
    <a class="back" href="/">← Overview</a>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Session auth only. After login you attach a Zerops PAT; deploys run as that account via <code>zcli</code>.</p>

      <div class="error" id="login-error" role="alert"></div>

      <form id="auth-form">
        <div class="field" id="name-field" style="display: none">
          <label class="zo-label" for="name">Name</label>
          <input class="zo-input" id="name" type="text" autocomplete="name" placeholder="Your name" />
        </div>
        <div class="field">
          <label class="zo-label" for="email">Email</label>
          <input class="zo-input" id="email" type="email" required autocomplete="email" placeholder="you@company.com" />
        </div>
        <div class="field">
          <label class="zo-label" for="password">Password</label>
          <input class="zo-input" id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="zo-btn zo-btn--primary" type="submit" id="auth-btn" style="width: 100%; margin-top: 4px">
          Sign in
        </button>
      </form>

      <div class="toggle">
        <span id="toggle-text">No account?</span>
        <a id="toggle-link">Create one</a>
      </div>

      <p class="note">
        Next step in Studio: paste PAT from<br />
        app.zerops.io → token management
      </p>
    </div>
  </div>

  <script>
    let isSignup = false;
    const errorEl = document.getElementById('login-error');

    document.getElementById('toggle-link').addEventListener('click', () => {
      isSignup = !isSignup;
      document.getElementById('name-field').style.display = isSignup ? 'block' : 'none';
      document.getElementById('auth-btn').textContent = isSignup ? 'Create account' : 'Sign in';
      document.getElementById('toggle-text').textContent = isSignup ? 'Have an account?' : 'No account?';
      document.getElementById('toggle-link').textContent = isSignup ? 'Sign in' : 'Create one';
      errorEl.classList.remove('is-on');
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = isSignup ? '/api/auth/signup' : '/api/auth/login';
      const body = isSignup
        ? { email: email.value, password: password.value, name: name.value }
        : { email: email.value, password: password.value };
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/studio';
        } else {
          errorEl.textContent = data.error || 'Auth failed';
          errorEl.classList.add('is-on');
        }
      } catch {
        errorEl.textContent = 'Connection error';
        errorEl.classList.add('is-on');
      }
    });

    fetch('/api/auth/me')
      .then((r) => r.json())
      .then((d) => {
        if (d.user) window.location.href = '/studio';
      })
      .catch(() => {});
  </script>
</body>
</html>
